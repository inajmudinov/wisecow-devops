name: Build and deploy Wisecow
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wisecow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wisecow:test
      - name: Test HTTP response
        run: |
          docker run -d --name wisecow -p 4499:4499 wisecow:test
          trap 'docker logs wisecow; docker rm -f wisecow' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 http://localhost:4499/ | grep '<pre>'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_CD == 'true'
    runs-on: [self-hosted, linux, wisecow]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy immutable image
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$(mktemp)"
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl -n wisecow apply -f k8s/service.yaml -f k8s/ingress.yaml
          kubectl set image --local -f k8s/deployment.yaml wisecow="$IMAGE" -o yaml | kubectl apply -f -
          kubectl -n wisecow rollout status deployment/wisecow --timeout=180s
